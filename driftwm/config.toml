autostart = ["noctalia", "pipewire", "wireplumber", "pipewire-pulse"]
[keybindings]
"mod+e" = "spawn dolphin"
"mod+t" = "spawn telegram-desktop"
"mod+z" = "spawn noctalia msg settings-toggle"
"mod+b" = "spawn xdg-open https://"
# Пример переключения по комбинации Mod + Space (или любой другой удобной вам)
"alt+shift" = "switch-layout next"
[background]
type = "wallpaper"
path = "/home/yanis/.config/driftwm/wallpaper.jpg"
[input.keyboard]
layout = "us,ru"
variant = ","
[decorations]
default_mode = "none"
corner_radius = 10
border_width = 2
